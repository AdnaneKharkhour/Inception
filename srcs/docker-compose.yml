services:
    mariadb:
        container_name: mariadb
        build:
            context: ./requirements/mariadb
            dockerfile: Dockerfile
        env_file: .env
        volumes:
          - mariadb_data:/var/lib/mysql
        networks:
            - inception
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
            interval: 10s
            timeout: 5s
            retries: 5
    
    wordpress:
        container_name: wordpress
        build:
            context: ./requirements/wordpress
            dockerfile: Dockerfile
        env_file: .env
        volumes:
          - wordpress_data:/var/www/html
        networks:
            - inception
        depends_on:
            - mariadb
        restart: unless-stopped
    
    nginx:
        container_name: nginx
        build:
            context: ./requirements/nginx
            dockerfile: Dockerfile
        ports:
          - "443:443"
        volumes:
          - wordpress_data:/var/www/html
        networks:
            - inception
        depends_on:
            - wordpress
        restart: unless-stopped

volumes:
    mariadb_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: ${DATA_PATH}/mariadb

    wordpress_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: ${DATA_PATH}/wordpress

networks:
    inception:
        driver: bridge
